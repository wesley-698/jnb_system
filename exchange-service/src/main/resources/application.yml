server:
  port: 8085

spring:
  application:
    name: exchange-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:coin_reservation}
    username: ${PG_USER:coin}
    password: ${PG_PASSWORD:coin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
