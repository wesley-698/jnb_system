server:
  port: 8084

spring:
  application:
    name: product-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:coin_reservation}
    username: ${PG_USER:coin}
    password: ${PG_PASSWORD:coin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 超时：防止缓存故障拖垮服务
      timeout: 500ms
      connect-timeout: 500ms
