# 邮储银行纪念币预约系统 — 本地开发基础设施
#
# 生产拓扑说明（本地仅单机示意）：
#   - Redis     生产用 Cluster（3主3从起步），本地单机即可
#   - Kafka     生产用 3+ broker、副本因子 3，本地 KRaft 单节点即可
#   - PostgreSQL 生产用 1主2从（Patroni/Repmgr 自动切换），本地单机即可
#
# 启动：docker compose up -d
# 说明：本机 Docker Hub 被墙，镜像通过 daocloud 加速源拉取，见 scripts/pull-images.sh
# 已安装 Docker Compose v2 插件（~/.docker/cli-plugins/docker-compose）

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: coin-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: coin-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.1
    container_name: coin-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
    # 本地开发不持久化 Kafka 数据（避免卷权限问题，topic 自动创建）
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: coin-postgres
    environment:
      - POSTGRES_USER=coin
      - POSTGRES_PASSWORD=coin123
      - POSTGRES_DB=coin_reservation
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
